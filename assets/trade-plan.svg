<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520"><rect x="0" y="0" width="1280" height="520" rx="18" fill="#0B1220"/><text x="48.0" y="52.0" font-family="Segoe UI, Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#94A3B8" fill-opacity="1" text-anchor="start" letter-spacing="2">TRADE PLAN · v11</text><text x="48.0" y="86.0" font-family="Segoe UI, Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="800" fill="#E5E7EB" fill-opacity="1" text-anchor="start" letter-spacing="0">Every signal comes with a plan — and a verdict</text><text x="48.0" y="114.0" font-family="Segoe UI, Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#94A3B8" fill-opacity="1" text-anchor="start" letter-spacing="0">The plan is drawn on the chart, sent in the alert and walked forward bar by bar into the statistics.</text><rect x="48.0" y="150.0" width="620.0" height="330.0" rx="14" fill="#0F172A" fill-opacity="1" stroke="#334155" stroke-width="1" /><rect x="138.0" y="342.8" width="315.0" height="69.4" rx="0" fill="#FF4D4F" fill-opacity="0.16" stroke="#FF4D4F" stroke-width="1" /><rect x="138.0" y="210.8" width="315.0" height="131.9" rx="0" fill="#00C896" fill-opacity="0.12" stroke="#00C896" stroke-width="1" /><line x1="138.0" y1="273.3" x2="453.0" y2="273.3" stroke="#00C896" stroke-width="1.5" stroke-opacity="1" stroke-linecap="butt" stroke-dasharray="6 4"/><line x1="138.0" y1="429.6" x2="453.0" y2="429.6" stroke="#A855F7" stroke-width="1" stroke-opacity="1" stroke-linecap="butt" stroke-dasharray="2 4"/><text x="463.0" y="214.8" font-family="Segoe UI, Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#00C896" fill-opacity="1" text-anchor="start" letter-spacing="0">TP2 · opposite liquidity</text><text x="463.0" y="277.3" font-family="Segoe UI, Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#00C896" fill-opacity="1" text-anchor="start" letter-spacing="0">TP1 · 1.0R</text><text x="463.0" y="346.8" font-family="Segoe UI, Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#E5E7EB" fill-opacity="1" text-anchor="start" letter-spacing="0">Entry · bar close</text><text x="463.0" y="416.2" font-family="Segoe UI, Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#FF4D4F" fill-opacity="1" text-anchor="start" letter-spacing="0">Stop · extreme − 0.25 ATR</text><text x="463.0" y="433.6" font-family="Segoe UI, Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#A855F7" fill-opacity="1" text-anchor="start" letter-spacing="0">sweep extreme</text><text x="126.0" y="416.2" font-family="JetBrains Mono, Consolas, Menlo, monospace" font-size="11.5" font-weight="400" fill="#94A3B8" fill-opacity="1" text-anchor="end" letter-spacing="0">-1.0R</text><text x="126.0" y="346.8" font-family="JetBrains Mono, Consolas, Menlo, monospace" font-size="11.5" font-weight="400" fill="#94A3B8" fill-opacity="1" text-anchor="end" letter-spacing="0">0R</text><text x="126.0" y="277.3" font-family="JetBrains Mono, Consolas, Menlo, monospace" font-size="11.5" font-weight="400" fill="#94A3B8" fill-opacity="1" text-anchor="end" letter-spacing="0">+1.0R</text><text x="126.0" y="214.8" font-family="JetBrains Mono, Consolas, Menlo, monospace" font-size="11.5" font-weight="400" fill="#94A3B8" fill-opacity="1" text-anchor="end" letter-spacing="0">+1.9R</text><path d="M138.0,342.8 L163.2,370.6 L194.7,321.9 L232.5,301.1 L270.3,269.9 L295.5,294.2 L333.3,252.5 L374.2,231.7 L408.9,207.4" stroke="#E5E7EB" fill="none" stroke-width="2" stroke-opacity="1" fill-opacity="1" stroke-linejoin="round" stroke-linecap="round" /><circle cx="270.3" cy="273.3" r="6" fill="#00C896" fill-opacity="1" stroke="none" stroke-width="1"/><text x="270.3" y="261.3" font-family="Segoe UI, Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#00C896" fill-opacity="1" text-anchor="middle" letter-spacing="0">50% off · stop → entry</text><circle cx="408.9" cy="210.8" r="6" fill="#00C896" fill-opacity="1" stroke="none" stroke-width="1"/><path d="M138.0,354.8 L132.0,362.8 L144.0,362.8 Z" stroke="none" fill="#00C896" stroke-width="1" stroke-opacity="1" fill-opacity="1" stroke-linejoin="round" stroke-linecap="round" /><rect x="119.8" y="362.8" width="36.5" height="24.0" rx="5" fill="#00C896" fill-opacity="1" stroke="none" stroke-width="1" /><text x="138.0" y="379.3" font-family="Segoe UI, Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" fill-opacity="1" text-anchor="middle" letter-spacing="0">▲ A</text><text x="700.0" y="176.0" font-family="Segoe UI, Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#E5E7EB" fill-opacity="1" text-anchor="start" letter-spacing="0">How each plan is scored</text><rect x="700.0" y="190.0" width="530.0" height="38.0" rx="9" fill="#111827" fill-opacity="1" stroke="#334155" stroke-width="1" /><text x="716.0" y="214.0" font-family="Segoe UI, Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#E5E7EB" fill-opacity="1" text-anchor="start" letter-spacing="0">Stop before TP1</text><text x="1214.0" y="214.0" font-family="JetBrains Mono, Consolas, Menlo, monospace" font-size="13.5" font-weight="700" fill="#FF4D4F" fill-opacity="1" text-anchor="end" letter-spacing="0">−1R</text><rect x="700.0" y="234.0" width="530.0" height="38.0" rx="9" fill="#111827" fill-opacity="1" stroke="#334155" stroke-width="1" /><text x="716.0" y="258.0" font-family="Segoe UI, Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#E5E7EB" fill-opacity="1" text-anchor="start" letter-spacing="0">TP1, then back to entry</text><text x="1214.0" y="258.0" font-family="JetBrains Mono, Consolas, Menlo, monospace" font-size="13.5" font-weight="700" fill="#FACC15" fill-opacity="1" text-anchor="end" letter-spacing="0">+ p·R1</text><rect x="700.0" y="278.0" width="530.0" height="38.0" rx="9" fill="#111827" fill-opacity="1" stroke="#334155" stroke-width="1" /><text x="716.0" y="302.0" font-family="Segoe UI, Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#E5E7EB" fill-opacity="1" text-anchor="start" letter-spacing="0">TP1, then TP2</text><text x="1214.0" y="302.0" font-family="JetBrains Mono, Consolas, Menlo, monospace" font-size="13.5" font-weight="700" fill="#00C896" fill-opacity="1" text-anchor="end" letter-spacing="0">p·R1 + (1−p)·R2</text><rect x="700.0" y="322.0" width="530.0" height="38.0" rx="9" fill="#111827" fill-opacity="1" stroke="#334155" stroke-width="1" /><text x="716.0" y="346.0" font-family="Segoe UI, Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#E5E7EB" fill-opacity="1" text-anchor="start" letter-spacing="0">Still open after N bars</text><text x="1214.0" y="346.0" font-family="JetBrains Mono, Consolas, Menlo, monospace" font-size="13.5" font-weight="700" fill="#94A3B8" fill-opacity="1" text-anchor="end" letter-spacing="0">closed at market</text><rect x="700.0" y="366.0" width="530.0" height="38.0" rx="9" fill="#111827" fill-opacity="1" stroke="#334155" stroke-width="1" /><text x="716.0" y="390.0" font-family="Segoe UI, Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#E5E7EB" fill-opacity="1" text-anchor="start" letter-spacing="0">Stop and target in one bar</text><text x="1214.0" y="390.0" font-family="JetBrains Mono, Consolas, Menlo, monospace" font-size="13.5" font-weight="700" fill="#FF4D4F" fill-opacity="1" text-anchor="end" letter-spacing="0">stop assumed first</text><rect x="700.0" y="410.0" width="530.0" height="38.0" rx="9" fill="#111827" fill-opacity="1" stroke="#334155" stroke-width="1" /><text x="716.0" y="434.0" font-family="Segoe UI, Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#E5E7EB" fill-opacity="1" text-anchor="start" letter-spacing="0">Every result</text><text x="1214.0" y="434.0" font-family="JetBrains Mono, Consolas, Menlo, monospace" font-size="13.5" font-weight="700" fill="#94A3B8" fill-opacity="1" text-anchor="end" letter-spacing="0">− costs in ticks</text><text x="700.0" y="492.0" font-family="Segoe UI, Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#94A3B8" fill-opacity="1" text-anchor="start" letter-spacing="0">p = share closed at TP1 (default 50%). Conservative by construction: no intrabar optimism.</text></svg>